const PAGE_SIZE=15;
const state={categories:new Set(),skus:new Set(),operators:new Set(),statuses:new Set(),query:"",page:1,sortKey:"status",sortDir:"asc"};
const statusOrder={"成功":0,"失败":1,"待处理":2,"无需处理":3};
const colors={"成功":"#15803d","失败":"#c2413a","待处理":"#b7791f","无需处理":"#64748b","其他":"#87928c"};
const esc=(v)=>String(v??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uniq=(arr)=>[...new Set(arr)].filter(Boolean);
const valuesFor=(key)=>uniq(DATA.flatMap(r=>r[key]||[])).sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function getFiltered(){const q=state.query.trim().toLowerCase();return DATA.filter(r=>{if(state.categories.size&&!r.categories.some(v=>state.categories.has(v)))return false;if(state.skus.size&&!r.skus.some(v=>state.skus.has(v)))return false;if(state.operators.size&&!r.operators.some(v=>state.operators.has(v)))return false;if(state.statuses.size&&!state.statuses.has(r.status))return false;if(q&&!JSON.stringify(r).toLowerCase().includes(q))return false;return true})}
function formatNum(n){return n.toLocaleString("zh-CN")}
function setupFilters(){const defs=[['categories','品类','categories'],['skus','SKU','skus'],['operators','运营','operators'],['statuses','上标状态',['成功','失败','待处理','无需处理']]];for(const [key,label,source] of defs){const el=document.querySelector('[data-filter="'+key+'"]');const menu=el.querySelector('.filter-menu');const options=Array.isArray(source)?source:valuesFor(source);menu.innerHTML=options.map((v,i)=>'<label><input type="checkbox" value="'+esc(v)+'"><span>'+esc(v)+'</span></label>').join('');el.querySelector('.filter-btn').addEventListener('click',(e)=>{e.stopPropagation();document.querySelectorAll('.filter.open').forEach(x=>x!==el&&x.classList.remove('open'));el.classList.toggle('open')});menu.addEventListener('click',(e)=>e.stopPropagation());menu.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{if(input.checked)state[key].add(input.value);else state[key].delete(input.value);state.page=1;updateFilterButton(el,label,state[key]);render()}));updateFilterButton(el,label,state[key]);}}
function updateFilterButton(el,label,selected){el.querySelector('.filter-btn span').textContent=label+'：'+(selected.size?'已选 '+selected.size+' 项':'全'+(label==='SKU'?'部':''))}
function render(){const rows=getFiltered();const total=rows.length;document.getElementById('filteredMeta').textContent='已筛选 '+formatNum(total)+' / '+formatNum(DATA.length)+' 条记录';renderKpis(rows);renderStatus(rows);renderCategories(rows);renderOperators(rows);renderReasons(rows);renderDetails(rows)}
function renderKpis(rows){const success=rows.filter(r=>r.status==='成功').length,failure=rows.filter(r=>r.status==='失败').length,pending=rows.filter(r=>r.status==='待处理').length,noAction=rows.filter(r=>r.status==='无需处理').length;const rate=rows.length?success/rows.length:0;document.getElementById('kpis').innerHTML=[['','ASIN总数',rows.length,''],['success','成功数',success,'占当前筛选 '+(rows.length?Math.round(success/rows.length*100):0)+'%'],['failure','失败数',failure,'含当前失败记录'],['pending','待处理',pending,'成功率 '+(rate*100).toFixed(1)+'%'],['no-action','无需处理',noAction,'无需继续跟进']].map(([cls,label,value,note])=>'<div class="kpi '+cls+'"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+formatNum(value)+'</div><div class="kpi-note">'+note+'</div></div>').join('')}
function renderStatus(rows){const counts={'成功':0,'失败':0,'待处理':0,'无需处理':0,'其他':0};rows.forEach(r=>counts[r.status]=(counts[r.status]??0)+1);const total=rows.length||1;const p1=counts['成功']/total*100,p2=p1+counts['失败']/total*100,p3=p2+counts['待处理']/total*100,p4=p3+counts['无需处理']/total*100;document.getElementById('statusChart').innerHTML='<div class="status-layout"><div class="donut" style="--p1:'+p1+'%;--p2:'+p2+'%;--p3:'+p3+'%;--p4:'+p4+'%"><div class="donut-center"><strong>'+formatNum(rows.length)+'</strong><span>筛选记录</span></div></div><div class="legend">'+[['成功','success'],['失败','failure'],['待处理','pending'],['无需处理','no-action'],['其他','other']].map(([name,cls])=>'<button class="legend-item" data-status="'+name+'" style="background:none;border:0;text-align:left;color:inherit;cursor:pointer"><span class="legend-label"><span class="dot" style="background:'+colors[name]+'"></span>'+name+'</span><strong>'+formatNum(counts[name])+' · '+(rows.length?(counts[name]/rows.length*100).toFixed(1):'0.0')+'%</strong></button>').join('')+'</div></div>';document.querySelectorAll('[data-status]').forEach(btn=>btn.addEventListener('click',()=>toggleSet('statuses',btn.dataset.status)))}
function toggleSet(key,value){if(state[key].has(value))state[key].delete(value);else state[key].add(value);const el=document.querySelector('[data-filter="'+key+'"]');updateFilterButton(el,key==='statuses'?'上标状态':key,state[key]);el.querySelectorAll('input').forEach(i=>i.checked=state[key].has(i.value));state.page=1;render()}
function renderCategories(rows){const map=new Map();rows.forEach(r=>{const k=r.primaryCategory;const o=map.get(k)??{total:0,success:0};o.total++;if(r.status==='成功')o.success++;map.set(k,o)});const data=[...map.entries()].map(([name,o])=>({name,...o,rate:o.success/o.total})).sort((a,b)=>b.total-a.total||b.rate-a.rate);document.getElementById('categoryChart').innerHTML=data.length?'<div class="bar-list">'+data.map(d=>'<button class="bar-row" data-category="'+esc(d.name)+'" style="background:none;border:0;text-align:left;color:inherit;cursor:pointer"><span class="bar-label" title="'+esc(d.name)+'">'+esc(d.name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+(d.rate*100)+'%"></span></span><span class="bar-value">'+d.success+'/'+d.total+' · '+(d.rate*100).toFixed(1)+'%</span></button>').join('')+'</div>':'<div class="empty">当前筛选无品类数据</div>';document.querySelectorAll('[data-category]').forEach(btn=>btn.addEventListener('click',()=>toggleSet('categories',btn.dataset.category)))}
function renderOperators(rows){const map=new Map();rows.forEach(r=>{const k=r.primaryOperator;const o=map.get(k)??{'成功':0,'失败':0,'待处理':0,'无需处理':0,total:0};o[r.status]=(o[r.status]??0)+1;o.total++;map.set(k,o)});const data=[...map.entries()].sort((a,b)=>b[1].total-a[1].total).slice(0,8);const max=Math.max(...data.map(d=>d[1].total),1);document.getElementById('operatorChart').innerHTML=data.length?'<div class="stack-list">'+data.map(([name,o])=>'<button class="stack-row" data-operator="'+esc(name)+'" style="background:none;border:0;text-align:left;color:inherit;cursor:pointer"><span class="bar-label" title="'+esc(name)+'">'+esc(name)+'</span><span class="stack-track"><span class="stack-seg" style="width:'+(o['成功']/max*100)+'%;background:'+colors['成功']+'"></span><span class="stack-seg" style="width:'+(o['失败']/max*100)+'%;background:'+colors['失败']+'"></span><span class="stack-seg" style="width:'+(o['待处理']/max*100)+'%;background:'+colors['待处理']+'"></span><span class="stack-seg" style="width:'+(o['无需处理']/max*100)+'%;background:'+colors['无需处理']+'"></span></span><span class="bar-value">'+o.total+' 条</span></button>').join('')+'</div>':'<div class="empty">当前筛选无运营数据</div>';document.querySelectorAll('[data-operator]').forEach(btn=>btn.addEventListener('click',()=>toggleSet('operators',btn.dataset.operator)))}
function renderReasons(rows){const failed=rows.filter(r=>r.status==='失败');const map=new Map();failed.forEach(r=>{for(const reason of r.reasonGroups){map.set(reason,(map.get(reason)??0)+1)}});const data=[...map.entries()].sort((a,b)=>b[1]-a[1]);const total=failed.length||1;document.getElementById('failureReasons').innerHTML=data.length?'<table class="failure-table"><thead><tr><th>归类</th><th>数量</th></tr></thead><tbody>'+data.map(([name,count])=>'<tr><td><div class="reason-main">'+esc(name)+'</div><div class="reason-sub">占失败 '+(count/total*100).toFixed(1)+'%</div></td><td>'+count+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">当前筛选无失败记录</div>'}
function statusChip(status){const cls=status==='成功'?'status-success':status==='失败'?'status-failure':status==='待处理'?'status-pending':status==='无需处理'?'status-no-action':'status-other';return '<span class="status-chip '+cls+'"><span class="dot" style="background:'+colors[status]+'"></span>'+status+'</span>'}
function renderDetails(rows){const sorted=[...rows].sort((a,b)=>{let av=a[state.sortKey],bv=b[state.sortKey];if(Array.isArray(av))av=av[0];if(Array.isArray(bv))bv=bv[0];if(state.sortKey==='status'){av=statusOrder[av]??99;bv=statusOrder[bv]??99}if(typeof av==='number'&&typeof bv==='number')return state.sortDir==='asc'?av-bv:bv-av;return String(av??'').localeCompare(String(bv??''),'zh-CN')*(state.sortDir==='asc'?1:-1)});const pages=Math.max(1,Math.ceil(sorted.length/PAGE_SIZE));state.page=Math.min(state.page,pages);const start=(state.page-1)*PAGE_SIZE;const pageRows=sorted.slice(start,start+PAGE_SIZE);document.getElementById('detailMeta').textContent='共 '+formatNum(rows.length)+' 条，当前显示 '+(rows.length?start+1:0)+'-'+Math.min(start+PAGE_SIZE,rows.length)+' 条';document.getElementById('detailBody').innerHTML=pageRows.length?pageRows.map(r=>'<tr><td><strong>'+esc(r.asin||'未填写')+'</strong></td><td>'+esc(r.primarySku)+'</td><td>'+esc(r.primaryCategory)+'</td><td>'+esc(r.primaryOperator)+'</td><td>'+statusChip(r.status)+(r.wasRejected?'<div class="history">历史被拒 '+r.rejectionCount+' 次，'+(r.status==='成功'?'已转成功':r.status==='无需处理'?'无需处理':'待跟进')+'</div>':'')+'</td><td>'+esc(r.primaryReason==='不适用'?'—':r.primaryReason)+'<div class="reason-sub">'+esc(r.rawReason||'')+'</div></td><td>'+r.rejectionCount+'</td></tr>').join(''):'<tr><td colspan="7"><div class="empty">没有符合当前筛选条件的记录</div></td></tr>';document.getElementById('pageInfo').textContent=state.page+' / '+pages;document.getElementById('prev').disabled=state.page<=1;document.getElementById('next').disabled=state.page>=pages}
document.addEventListener('click',()=>document.querySelectorAll('.filter.open').forEach(x=>x.classList.remove('open')));document.getElementById('query').addEventListener('input',e=>{state.query=e.target.value;state.page=1;render()});document.getElementById('reset').addEventListener('click',()=>{for(const key of ['categories','skus','operators','statuses'])state[key].clear();document.querySelectorAll('.filter').forEach(el=>{el.classList.remove('open');el.querySelectorAll('input').forEach(i=>i.checked=false);const key=el.dataset.filter;const label=key==='categories'?'品类':key==='operators'?'运营':key==='statuses'?'上标状态':'SKU';updateFilterButton(el,label,state[key])});state.query='';document.getElementById('query').value='';state.page=1;render()});document.getElementById('prev').addEventListener('click',()=>{state.page--;render()});document.getElementById('next').addEventListener('click',()=>{state.page++;render()});document.querySelectorAll('[data-sort]').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.sort;if(state.sortKey===key)state.sortDir=state.sortDir==='asc'?'desc':'asc';else{state.sortKey=key;state.sortDir='asc'}render()}));document.getElementById('export').addEventListener('click',()=>{const rows=getFiltered();const headers=['ASIN','SKU','系统SKU','品类','运营','上标状态','失败原因','历史被拒次数'];const csv=[headers,...rows.map(r=>[r.asin,r.skus.join(' / '),r.systemSkus.join(' / '),r.categories.join(' / '),r.operators.join(' / '),r.status,r.rawReason,r.rejectionCount])].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='JT二部-ASIN绿标筛选明细.csv';a.click();URL.revokeObjectURL(url)});setupFilters();render();
</script>
